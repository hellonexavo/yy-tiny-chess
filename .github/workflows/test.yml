name: Tiny Chess offline tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -p 'test_chess.py' -v
      - run: python -c "from pathlib import Path; p=Path('main.py'); assert p.stat().st_size <= 4096, p.stat().st_size"
